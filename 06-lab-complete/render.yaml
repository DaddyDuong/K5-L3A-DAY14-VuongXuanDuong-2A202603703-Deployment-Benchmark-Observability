services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DAILY_BUDGET_USD
        value: "5.0"
      - key: MONTHLY_BUDGET_USD
        value: "50.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
